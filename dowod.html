<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="white">
    <meta name="apple-mobile-web-app-title" content="mObywatel">
    <title>mObywatel</title>
    <style>
        body { margin: 0; background: #ffffff; font-family: -apple-system, sans-serif; overflow: hidden; color: #1a1a1a; }
        
        /* BIAŁY NAGŁÓWEK Z OBRAZKA */
        .top-nav { background: #ffffff; height: 110px; padding: 50px 20px 0; display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid #eee;}
        .wroc { color: #007aff; font-size: 17px; cursor: pointer; display: flex; align-items: center;}
        .header-title { font-size: 17px; font-weight: bold; position: absolute; left: 50%; transform: translateX(-50%); }
        .circle-init { width: 32px; height: 32px; background: #e6f0fa; color: #007aff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;}

        /* SEKCJA DATY */
        .date-ref { text-align: center; color: #777; font-size: 11px; margin-top: 15px;}

        /* NOWOCZESNA KARTA mDOWÓD (Błękitne tło) */
        .card { 
            margin: 20px auto; width: 92%; height: 360px; 
            background: linear-gradient(135deg, #f0f7fe 0%, #e6f1fb 100%); 
            border-radius: 20px; 
            position: relative; overflow: hidden; 
            border: 0.5px solid #eee;
        }
        
        /* DUŻY KONTUR ORŁA W TLE */
        .card-bg-eagle {
            position: absolute; width: 220px; bottom: -20px; right: -20px;
            opacity: 0.08; filter: grayscale(1); transition: transform 0.1s linear;
        }

        /* WARSTWA TREŚCI */
        .card-body { position: relative; z-index: 5; padding: 25px 20px; display: flex; }

        /* SEKCJA LEWA (ZDJĘCIE I FLAGA) */
        .photo-pane { width: 42%; position: relative;}
        
        /* Przezroczyste zdjęcie z białą ramką - jak na obrazku */
        .photo-wrap { width: 105px; height: 140px; border: 4px solid #ffffff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow: hidden;}
        .photo-wrap img { width: 100%; height: 100%; object-fit: cover; }
        
        .flag-pane { width: 45px; margin-top: 15px;}
        .flag-pane img { width: 100%; object-fit: contain;}

        /* SEKCJA PRAWA (DANE) */
        .data-pane { width: 58%; padding-left: 10px;}
        .data-item { margin-bottom: 12px;}
        .val { font-size: 15px; font-weight: 800; color: #1a1a1a; text-transform: uppercase;}
        .lab { font-size: 9px; color: #777;}

        /* ZIELONY STATUS - JAK NA OBRAZKU */
        .status-pane {
            position: absolute; bottom: 85px; width: calc(100% - 30px); margin: 0 15px;
            background: #ffffff; border-radius: 15px; padding: 12px;
            display: flex; align-items: center; border: 1px solid #e0e0e0; z-index: 10;
        }
        .status-circle { width: 22px; height: 22px; background: #e8f5e9; color: #2e7d32; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 12px; font-weight: bold; font-size: 12px; border: 1px solid #c8e6c9;}
        .status-txt { color: #2e7d32; font-weight: bold; font-size: 14px;}

        /* PASEK SKRÓTÓW NA DOLE DOWODU */
        .skroty-bar {
            position: absolute; bottom: 0; width: 100%; height: 75px;
            background: #ffffff; border-top: 1px solid #e0e0e0;
            display: flex; justify-content: space-around; align-items: center; z-index: 10; padding: 0 10px 5px 10px; box-sizing: border-box;
        }
        .skrot-item { text-align: center; color: #1a1a1a; font-size: 9px; font-weight: 600;}
        .skrot-circle { width: 38px; height: 38px; background: #f0f3f8; border-radius: 50%; margin: 0 auto 5px; display: flex; align-items: center; justify-content: center;}
        .skrot-circle img { width: 20px; height: 20px; filter: grayscale(1) opacity(0.8);}
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="wroc">❮ Wróć</div>
        <div class="header-title">mDowód</div>
        <div class="circle-init" id="u-init">M</div>
    </div>

    <div class="date-ref">Czas: <span id="u-time">9:41:21 17.02.2025</span></div>

    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Coat_of_arms_of_Poland.svg/500px-Coat_of_arms_of_Poland.svg.png" class="card-bg-eagle" id="eagle-bg">
        
        <div class="card-body">
            <div class="photo-pane">
                <div class="photo-wrap"><img src="" id="u-photo"></div>
                <div class="flag-pane">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/Flag_of_Poland_%28normalized%29.svg/100px-Flag_of_Poland_%28normalized%29.svg.png" alt="Polska flaga">
                </div>
            </div>
            
            <div class="data-pane">
                <div class="data-item"><div class="val" id="u-imie">Marta</div><div class="lab">Imię (Imiona)http://googleusercontent.com/generated_image_content/0
