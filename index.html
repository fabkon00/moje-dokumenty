<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>mObywatel - Konfiguracja</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .box { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { color: #1A2B4C; text-align: center; font-size: 22px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #1A2B4C; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Ustawienia Danych</h1>
        <input type="text" id="imie" placeholder="Imię (Imiona)">
        <input type="text" id="nazwisko" placeholder="Nazwisko">
        <input type="text" id="pesel" placeholder="PESEL" maxlength="11">
        <p style="font-size: 12px; color: #777;">Zdjęcie z galerii:</p>
        <input type="file" id="foto" accept="image/*">
        <button onclick="zapisz()">STWÓRZ DOKUMENT</button>
    </div>

    <script>
        function zapisz() {
            localStorage.setItem('m_imie', document.getElementById('imie').value);
            localStorage.setItem('m_nazwisko', document.getElementById('nazwisko').value);
            localStorage.setItem('m_pesel', document.getElementById('pesel').value);
            
            const file = document.getElementById('foto').files[0];
            const start = () => {
                // Wymagane dla iOS, by żyroskop zadziałał
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(state => {
                        if(state == 'granted') window.location.href = 'dowod.html';
                    });
                } else { window.location.href = 'dowod.html'; }
            };

            if(file) {
                const reader = new FileReader();
                reader.onload = e => { 
                    localStorage.setItem('m_foto', e.target.result); 
                    start();
                };
                reader.readAsDataURL(file);
            } else { start(); }
        }
    </script>
</body>
</html>
